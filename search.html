<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toe Beans.AI — Search</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"><div id="app-nav-top"></div></header>

  <main class="wrap" style="padding-top: 20px;">
    <h1>Search the catalogue</h1>

    <label for="q">Name, shelter ID, or Cat ID</label>
    <input id="q" type="text" placeholder="e.g. Biscuit, tag #A1042, or Cat #12" />

    <label for="shelter-filter">Shelter</label>
    <select id="shelter-filter">
      <option value="">All shelters</option>
    </select>

    <div class="section-label" id="result-count"></div>
    <div id="results"></div>
  </main>

  <nav class="tabbar" id="app-nav-bottom"></nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script>
    renderNav("search");

    const qEl = document.getElementById("q");
    const shelterEl = document.getElementById("shelter-filter");
    const resultsEl = document.getElementById("results");
    const countEl = document.getElementById("result-count");

    async function loadShelters() {
      const { data } = await sb.from("shelters").select("id, name").order("name");
      (data || []).forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.name;
        shelterEl.appendChild(opt);
      });
    }

    function renderResults(cats) {
      countEl.textContent = cats.length + (cats.length === 1 ? " cat" : " cats");
      if (cats.length === 0) {
        resultsEl.innerHTML = `<p class="empty">No cats match that search.</p>`;
        return;
      }
      resultsEl.innerHTML = cats.map(c => `
        <a href="cat.html?id=${c.id}">
          <div class="card cat-card">
            ${c.photo_url ? `<div class="thumb-shell"><img class="thumb" src="${c.photo_url}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" /><div class="thumb cat-placeholder" style="display:none;"><svg viewBox="0 0 64 64" aria-hidden="true"><path class="silhouette" d="M22 22c0-6 4-10 10-10s10 4 10 10v4c0 2 1 4 3 6 2-1 4-2 6-2 2 0 4 1 5 3l3 6c1 2 0 4-2 5l-4 2v7c0 5-4 9-9 9h-2v-8h-2v8h-2v-8h-2v8h-2v-8h-2v8h-2c-5 0-9-4-9-9v-7l-4-2c-2-1-3-3-2-5l3-6c1-2 3-3 5-3 2 0 4 1 6 2 2-2 3-4 3-6v-4zm8 8c-2 0-4 2-4 4s2 4 4 4h8c2 0 4-2 4-4s-2-4-4-4h-8zm-4 16h16v4H26v-4z"/></svg></div></div>` : `<div class="thumb cat-placeholder"><svg viewBox="0 0 64 64" aria-hidden="true"><path class="silhouette" d="M22 22c0-6 4-10 10-10s10 4 10 10v4c0 2 1 4 3 6 2-1 4-2 6-2 2 0 4 1 5 3l3 6c1 2 0 4-2 5l-4 2v7c0 5-4 9-9 9h-2v-8h-2v8h-2v-8h-2v8h-2v-8h-2v8h-2c-5 0-9-4-9-9v-7l-4-2c-2-1-3-3-2-5l3-6c1-2 3-3 5-3 2 0 4 1 6 2 2-2 3-4 3-6v-4zm8 8c-2 0-4 2-4 4s2 4 4 4h8c2 0 4-2 4-4s-2-4-4-4h-8zm-4 16h16v4H26v-4z"/></svg></div>`}
            <div class="body">
              <div class="name">${c.name}</div>
              <div class="meta">${c.shelters ? c.shelters.name : "Unknown shelter"}${c.cat_number ? " · <span class=\"cat-id\">Cat #" + c.cat_number + "</span>" : ""}${c.shelter_cat_id ? " · <span class=\"cat-id\">#" + c.shelter_cat_id + "</span>" : ""}</div>
              <div class="tags">${(c.tags || []).map(t => `<span class="tag">${t}</span>`).join("")}</div>
            </div>
          </div>
        </a>
      `).join("");
    }

    async function search() {
      const term = qEl.value.trim();
      const shelterId = shelterEl.value;

      let query = sb.from("cats").select("id, cat_number, name, shelter_cat_id, tags, photo_url, shelters(name)");
      if (term) {
        const cleanTerm = term.replace(/[^a-zA-Z0-9]/g, "");
        const catIdMatch = /^\d+$/.test(term) ? `cat_number.eq.${Number(term)}` : null;
        const textMatch = `name.ilike.%${term}%,shelter_cat_id.ilike.%${term}%`;
        query = catIdMatch ? query.or(`${catIdMatch},${textMatch}`) : query.or(textMatch);
      }
      if (shelterId) {
        query = query.eq("shelter_id", shelterId);
      }

      const { data: cats, error: catError } = await query.order("created_at", { ascending: false }).limit(100);
      if (catError) {
        renderResults([]);
        return;
      }

      const { data: ratings, error: ratingError } = await sb.from("ratings").select("cat_id");
      if (ratingError) {
        renderResults([]);
        return;
      }

      const activeCatIds = new Set((ratings || []).map(r => r.cat_id));
      const visibleCats = (cats || []).filter(cat => activeCatIds.has(cat.id));
      renderResults(visibleCats);
    }

    let debounceTimer;
    qEl.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(search, 250);
    });
    shelterEl.addEventListener("change", search);

    loadShelters();
    search();
  </script>
</body>
</html>
