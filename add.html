<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toe Beans.AI — Add a Cat</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
</head>
<body>
  <header class="topbar"><div id="app-nav-top"></div></header>

  <!-- Crop Modal -->
  <div id="crop-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; padding: 16px;">
    <div style="background: white; border-radius: 16px; padding: 20px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto;">
      <h2 style="margin-top: 0; margin-bottom: 12px;">Crop to Square</h2>
      <div style="background: #f0f0f0; border-radius: 8px; overflow: hidden; margin-bottom: 16px;">
        <img id="crop-image" src="" style="max-width: 100%; display: block;" />
      </div>
      <div style="display: flex; gap: 10px; flex-direction: column;">
        <button id="crop-confirm" class="btn" style="flex: 1; min-height: 48px;">Use Photo</button>
        <button id="crop-cancel" class="btn secondary" style="flex: 1; min-height: 48px;">Cancel</button>
      </div>
    </div>
  </div>

  <main class="wrap" style="padding-top: 20px; max-width: 480px;">
    <h1 id="page-title">Add a new cat</h1>
    <p id="page-subtitle" style="color: var(--ink-soft); font-size: 0.9rem;">
      Add a cat that is not already in the system. This creates a brand-new cat record and gives you the first profile details.
    </p>

    <div id="form-fields-full" style="display: block;">
      <div style="flex: 1; min-width: 0; margin-bottom: 16px;">
        <label for="name">Cat name</label>
        <input id="name" type="text" required />
      </div>

      <label for="shelter">Owner / Shelter</label>
      <input id="shelter" type="text" placeholder="e.g. Riverside Humane Society" list="shelter-options" />
      <datalist id="shelter-options"></datalist>

      <div class="row">
        <div style="flex: 1; min-width: 0;">
          <label for="age-number">Age</label>
          <div class="row" style="gap: 8px; margin-top: 6px;">
            <select id="age-number" style="flex: 1; min-width: 0;" aria-label="Age number">
              <option value="">— No age</option>
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
            </select>
            <select id="age-unit" style="flex: 1; min-width: 0;" aria-label="Age unit">
              <option value="">— No age</option>
              <option value="months">Months</option>
              <option value="years">Years</option>
            </select>
          </div>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="sex">Sex</label>
          <select id="sex">
            <option value="" selected>Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div>
          <label for="color">Color</label>
          <input id="color" type="text" />
        </div>
      </div>
    </div>

    <label for="photo-file">Upload photos</label>
    <input id="photo-file" type="file" accept="image/*" multiple />

    <label for="notes">Notes</label>
    <textarea id="notes" placeholder="Anything memorable about this cat"></textarea>

    <p class="error-text" id="err" style="display:none;"></p>

    <button class="btn block" id="submit-btn" style="margin-top:18px;">Save cat</button>
  </main>

  <nav class="tabbar" id="app-nav-bottom"></nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/catOwnership.js"></script>
  <script>
    let currentSession;

    async function loadShelterOptions() {
      const { data } = await sb.from("shelters").select("name").order("name");
      const dl = document.getElementById("shelter-options");
      (data || []).forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.name;
        dl.appendChild(opt);
      });
    }

    async function findOrCreateShelter(name) {
      if (!name) return null;
      const { data: existing } = await sb.from("shelters").select("id").eq("name", name).maybeSingle();
      if (existing) return existing.id;
      const { data: created, error } = await sb.from("shelters").insert({ name }).select("id").single();
      if (error) throw error;
      return created.id;
    }

    function normalizePhotoUrls(value) {
      if (!value) return [];
      return String(value)
        .split(/[\n,;]+/)
        .map(s => s.trim())
        .filter(Boolean);
    }

    async function uploadPhotoIfNeeded(existingUrl = null) {
      const fileInput = document.getElementById("photo-file");
      const files = fileInput && fileInput.files ? Array.from(fileInput.files) : [];
      const urlInput = document.getElementById("photo-url");
      const additionalUrls = normalizePhotoUrls(urlInput ? urlInput.value : "");
      const existingUrls = normalizePhotoUrls(existingUrl);

      const uploadedUrls = [];
      for (const file of files) {
        const safeFileName = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g, "-")}`;
        const { data, error } = await sb.storage.from("cat-photos").upload(safeFileName, file, {
          cacheControl: "3600",
          upsert: true
        });

        if (error) {
          throw new Error("Photo upload failed. Create a public 'cat-photos' bucket in Supabase or upload a different file.");
        }

        const { data: publicData } = sb.storage.from("cat-photos").getPublicUrl(data.path);
        if (publicData?.publicUrl) uploadedUrls.push(publicData.publicUrl);
      }

      const combined = [...existingUrls, ...uploadedUrls, ...additionalUrls];
      return [...new Set(combined)].join(", ") || null;
    }

    function parseAgeValue(ageValue) {
      if (!ageValue) return { number: "", unit: "" };
      const match = String(ageValue).trim().match(/^(\d+)\s*(months?|years?)$/i);
      if (!match) return { number: "", unit: "" };
      const number = match[1];
      const unit = match[2].toLowerCase().startsWith("month") ? "months" : "years";
      return { number, unit };
    }

    async function getNextCatNumber() {
      const { data } = await sb
        .from("cats")
        .select("cat_number")
        .order("cat_number", { ascending: false })
        .limit(1)
        .maybeSingle();

      return Number(data?.cat_number || 0) + 1;
    }

    async function loadCatForEdit(catId) {
      const { data: cat, error } = await sb
        .from("cats")
        .select("*")
        .eq("id", catId)
        .maybeSingle();

      if (error) throw error;
      if (!cat) throw new Error("Could not find that cat to edit.");

      const isOwner = canEditCat(currentSession.user.id, cat.added_by);
      const fullFieldsContainer = document.getElementById("form-fields-full");

      if (!isOwner) {
        // Non-owner: show only photos and notes
        fullFieldsContainer.style.display = "none";
        document.getElementById("page-title").textContent = "Add photos & notes";
        document.getElementById("page-subtitle").textContent = "Share additional photos and observations about this cat.";
        document.getElementById("submit-btn").textContent = "Save photos & notes";
        
        // Load their own note from the ratings table
        const { data: myRating } = await sb
          .from("ratings")
          .select("note")
          .eq("user_id", currentSession.user.id)
          .eq("cat_id", catId)
          .maybeSingle();
        document.getElementById("notes").value = myRating?.note || "";
      } else {
        // Owner: show full edit form
        document.getElementById("page-title").textContent = "Edit cat";
        document.getElementById("page-subtitle").textContent = "Update the details for this cat.";
        document.getElementById("submit-btn").textContent = "Update cat";

        document.getElementById("name").value = cat.name || "";
        document.getElementById("shelter").value = cat.shelter_id ? (await getShelterName(cat.shelter_id)) || "" : "";
        const ageValue = parseAgeValue(cat.age);
        document.getElementById("age-number").value = ageValue.number || "";
        document.getElementById("age-unit").value = ageValue.unit || "";
        document.getElementById("sex").value = cat.sex || "";
        document.getElementById("color").value = cat.color || "";
        
        // For owner, show the cat's notes
        document.getElementById("notes").value = cat.notes || "";
      }

      return { cat, isOwner };
    }

    async function getShelterName(shelterId) {
      const { data } = await sb.from("shelters").select("name").eq("id", shelterId).maybeSingle();
      return data ? data.name : "";
    }

    document.getElementById("submit-btn").onclick = async () => {
      const err = document.getElementById("err");
      err.style.display = "none";

      const editId = new URLSearchParams(window.location.search).get("edit");
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Saving…";

      try {
        const editId = new URLSearchParams(window.location.search).get("edit");
        const existingCat = editId ? await sb.from("cats").select("photo_url, added_by").eq("id", editId).maybeSingle().then(r => r.data) : null;
        if (editId && !existingCat) {
          throw new Error("Could not find that cat to update.");
        }

        const isOwner = !editId || canEditCat(currentSession.user.id, existingCat?.added_by);
        const isNonOwnerEdit = editId && !isOwner;

        let photoUrl = null;
        if (isNonOwnerEdit) {
          // Non-owner edit: only append new photos/notes to existing
          photoUrl = await uploadPhotoIfNeeded(existingCat?.photo_url || null);
        } else if (isOwner || !editId) {
          // Owner edit or new cat: process all fields
          photoUrl = await uploadPhotoIfNeeded(existingCat?.photo_url || null);
        }

        let payload;
        let ratingNote = null;
        if (isNonOwnerEdit) {
          // Non-owner: update cat photos, and save note to their rating
          payload = {
            photo_url: photoUrl
          };
          ratingNote = document.getElementById("notes").value.trim() || null;
        } else {
          // Owner or new cat: full update
          const name = document.getElementById("name").value.trim();
          if (!name) {
            err.textContent = "Give the cat a name.";
            err.style.display = "block";
            btn.disabled = false;
            btn.textContent = document.getElementById("submit-btn").dataset.originalText || "Save cat";
            return;
          }

          const shelterName = document.getElementById("shelter").value.trim();
          const shelterId = await findOrCreateShelter(shelterName);

          const ageNumber = document.getElementById("age-number").value.trim();
          const ageUnit = document.getElementById("age-unit").value;
          const age = ageNumber && ageUnit ? `${ageNumber} ${ageUnit}` : null;

          payload = buildCatPayload({
            currentUserId: currentSession.user.id,
            existingCat,
            values: {
              name,
              shelter_id: shelterId,
              age,
              sex: document.getElementById("sex").value || null,
              color: document.getElementById("color").value.trim() || null,
              photo_url: photoUrl,
              notes: document.getElementById("notes").value.trim() || null
            }
          });

          if (!editId) {
            payload.cat_number = await getNextCatNumber();
          }
        }

        let cat;
        if (editId) {
          const { data, error } = await sb.from("cats").update(payload).eq("id", editId).select("id").maybeSingle();
          if (error) throw error;
          if (!data) throw new Error("Could not find that cat to update.");
          cat = data;
          
          // If non-owner, also save their note to the ratings table
          if (isNonOwnerEdit && ratingNote !== null) {
            const { error: ratingError } = await sb.from("ratings").update({
              note: ratingNote,
              updated_at: new Date().toISOString()
            }).eq("user_id", currentSession.user.id).eq("cat_id", editId);
            if (ratingError) throw ratingError;
          }
        } else {
          const { data, error } = await sb.from("cats").insert({
            ...payload,
            added_by: currentSession.user.id
          }).select("id").single();

          if (error) throw error;
          cat = data;

          await sb.from("ratings").insert({
            user_id: currentSession.user.id,
            cat_id: cat.id,
            elo_score: 1500
          });

          window.location.href = `compare.html?new=${cat.id}`;
          return;
        }

        window.location.href = `cat.html?id=${cat.id}`;
      } catch (e) {
        err.textContent = e.message || "Something went wrong saving that cat.";
        err.style.display = "block";
        btn.disabled = false;
        btn.textContent = document.getElementById("submit-btn").dataset.originalText || "Save cat";
      }
    };

    // ===== CROP FUNCTIONALITY =====
    let cropper = null;
    const cropModal = document.getElementById("crop-modal");
    const cropImage = document.getElementById("crop-image");
    const photoFileInput = document.getElementById("photo-file");
    const cropCancelBtn = document.getElementById("crop-cancel");
    const cropConfirmBtn = document.getElementById("crop-confirm");
    let currentFileIndex = 0;
    let filesToCrop = [];

    function showCropModal(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        cropImage.src = e.target.result;
        cropModal.style.display = "flex";

        // Destroy previous cropper instance if exists
        if (cropper) cropper.destroy();

        // Initialize new cropper with 1:1 square aspect ratio
        cropper = new Cropper(cropImage, {
          aspectRatio: 1,
          viewMode: 1,
          autoCropArea: 1,
          responsive: true,
          restore: true,
          guides: true,
          center: true,
          highlight: true,
          cropBoxMovable: true,
          cropBoxResizable: true,
          toggleDragModeOnDblclick: true,
        });
      };
      reader.readAsDataURL(file);
    }

    cropCancelBtn.addEventListener("click", () => {
      cropModal.style.display = "none";
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
      // Reset file input
      photoFileInput.value = "";
      filesToCrop = [];
      currentFileIndex = 0;
    });

    cropConfirmBtn.addEventListener("click", () => {
      if (!cropper) return;

      // Get cropped canvas
      const canvas = cropper.getCroppedCanvas({
        maxWidth: 2000,
        maxHeight: 2000,
        imageSmoothingEnabled: true,
        imageSmoothingQuality: "high",
      });
      canvas.toBlob((blob) => {
        // Create a new File object from the blob
        const croppedFile = new File([blob], filesToCrop[currentFileIndex].name, { type: "image/jpeg" });
        
        // Store cropped files
        if (!photoFileInput._croppedFiles) {
          photoFileInput._croppedFiles = {};
        }
        photoFileInput._croppedFiles[filesToCrop[currentFileIndex].name] = croppedFile;

        // Move to next file or close modal
        currentFileIndex++;
        if (currentFileIndex < filesToCrop.length) {
          showCropModal(filesToCrop[currentFileIndex]);
        } else {
          cropModal.style.display = "none";
          if (cropper) {
            cropper.destroy();
            cropper = null;
          }
          filesToCrop = [];
          currentFileIndex = 0;
        }
      }, "image/jpeg", 0.95);
    });

    // Intercept file input change
    photoFileInput.addEventListener("change", (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length > 0) {
        filesToCrop = files;
        currentFileIndex = 0;
        showCropModal(files[0]);
      }
    });

    // Modify uploadPhotoIfNeeded to use cropped files
    const originalUploadPhotoIfNeeded = uploadPhotoIfNeeded;
    uploadPhotoIfNeeded = async function(existingUrl = null) {
      const fileInput = document.getElementById("photo-file");
      let files = fileInput && fileInput.files ? Array.from(fileInput.files) : [];
      
      // Use cropped files if available
      if (fileInput._croppedFiles) {
        files = files.map(f => fileInput._croppedFiles[f.name] || f);
      }
      
      const urlInput = document.getElementById("photo-url");
      const additionalUrls = normalizePhotoUrls(urlInput ? urlInput.value : "");
      const existingUrls = normalizePhotoUrls(existingUrl);

      const uploadedUrls = [];
      for (const file of files) {
        const safeFileName = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g, "-")}`;
        const { data, error } = await sb.storage.from("cat-photos").upload(safeFileName, file, {
          cacheControl: "3600",
          upsert: true
        });

        if (error) {
          throw new Error("Photo upload failed. Create a public 'cat-photos' bucket in Supabase or upload a different file.");
        }

        const { data: publicData } = sb.storage.from("cat-photos").getPublicUrl(data.path);
        if (publicData?.publicUrl) uploadedUrls.push(publicData.publicUrl);
      }

      const combined = [...existingUrls, ...uploadedUrls, ...additionalUrls];
      return [...new Set(combined)].join(", ") || null;
    };

    (async () => {
      currentSession = await requireAuth();
      if (!currentSession) return;
      renderNav("add");
      loadShelterOptions();

      const editId = new URLSearchParams(window.location.search).get("edit");
      const saveButton = document.getElementById("submit-btn");
      saveButton.dataset.originalText = saveButton.textContent;

      if (editId) {
        try {
          const { cat: editingCat, isOwner } = await loadCatForEdit(editId);
        } catch (e) {
          const err = document.getElementById("err");
          err.textContent = e.message || "Could not open that cat for editing.";
          err.style.display = "block";
          saveButton.disabled = true;
        }
      }
    })();
  </script>
</body>
</html>
