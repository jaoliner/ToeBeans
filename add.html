<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat Ranker — Add a Cat</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"><div id="app-nav-top"></div></header>

  <main class="wrap" style="padding-top: 20px; max-width: 480px;">
    <h1 id="page-title">Add a Cat</h1>
    <p id="page-subtitle" style="color: var(--ink-soft); font-size: 0.9rem;">
      Log a cat you've met. You'll rank it against a few others next.
    </p>

    <div class="row">
      <div style="flex: 1; min-width: 0;">
        <label for="name">Name</label>
        <input id="name" type="text" required />
      </div>
      <div style="flex: 1; min-width: 0;">
        <label for="cat-number">Cat ID</label>
        <input id="cat-number" type="number" min="1" placeholder="optional" />
      </div>
    </div>

    <label for="shelter">Owner / Shelter</label>
    <input id="shelter" type="text" placeholder="e.g. Riverside Humane Society" list="shelter-options" />
    <datalist id="shelter-options"></datalist>

    <div class="row">
      <div style="flex: 1; min-width: 0;">
        <label for="age-number">Age</label>
        <div class="row" style="gap: 8px; margin-top: 6px;">
          <select id="age-number" style="flex: 1; min-width: 0;" aria-label="Age number">
            <option value="" selected disabled>—</option>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
          </select>
          <select id="age-unit" style="flex: 1; min-width: 0;" aria-label="Age unit">
            <option value="" selected disabled>Select</option>
            <option value="months">Months</option>
            <option value="years">Years</option>
          </select>
        </div>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="sex">Sex</label>
        <select id="sex">
          <option value="" selected>Select</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>
      <div>
        <label for="color">Color</label>
        <input id="color" type="text" />
      </div>
    </div>

    <label for="photo-file">Upload a photo</label>
    <input id="photo-file" type="file" accept="image/*" />

    <label for="notes">Notes</label>
    <textarea id="notes" placeholder="Anything memorable about this cat"></textarea>

    <p class="error-text" id="err" style="display:none;"></p>

    <button class="btn block" id="submit-btn" style="margin-top:18px;">Save cat</button>
  </main>

  <nav class="tabbar" id="app-nav-bottom"></nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentSession;

    async function loadShelterOptions() {
      const { data } = await sb.from("shelters").select("name").order("name");
      const dl = document.getElementById("shelter-options");
      (data || []).forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.name;
        dl.appendChild(opt);
      });
    }

    async function findOrCreateShelter(name) {
      if (!name) return null;
      const { data: existing } = await sb.from("shelters").select("id").eq("name", name).maybeSingle();
      if (existing) return existing.id;
      const { data: created, error } = await sb.from("shelters").insert({ name }).select("id").single();
      if (error) throw error;
      return created.id;
    }

    async function uploadPhotoIfNeeded(existingUrl = null) {
      const fileInput = document.getElementById("photo-file");
      const file = fileInput && fileInput.files && fileInput.files[0];

      if (!file) {
        return existingUrl || null;
      }

      const safeFileName = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g, "-")}`;
      const { data, error } = await sb.storage.from("cat-photos").upload(safeFileName, file, {
        cacheControl: "3600",
        upsert: true
      });

      if (error) {
        throw new Error("Photo upload failed. Create a public 'cat-photos' bucket in Supabase or upload a different file.");
      }

      const { data: publicData } = sb.storage.from("cat-photos").getPublicUrl(data.path);
      return publicData?.publicUrl || existingUrl || null;
    }

    function parseAgeValue(ageValue) {
      if (!ageValue) return { number: "", unit: "" };
      const match = String(ageValue).trim().match(/^(\d+)\s*(months?|years?)$/i);
      if (!match) return { number: "", unit: "" };
      const number = match[1];
      const unit = match[2].toLowerCase().startsWith("month") ? "months" : "years";
      return { number, unit };
    }

    async function getNextCatNumber() {
      const { data } = await sb
        .from("cats")
        .select("cat_number")
        .order("cat_number", { ascending: false })
        .limit(1)
        .maybeSingle();

      return Number(data?.cat_number || 0) + 1;
    }

    async function populateCatNumberPreview() {
      const input = document.getElementById("cat-number");
      input.value = "";
    }

    async function loadCatForEdit(catId) {
      const { data: cat, error } = await sb
        .from("cats")
        .select("*")
        .eq("id", catId)
        .maybeSingle();

      if (error) throw error;
      if (!cat) throw new Error("Could not find that cat to edit.");
      if (cat.added_by && cat.added_by !== currentSession.user.id) {
        throw new Error("You can only edit your own cats.");
      }

      document.getElementById("page-title").textContent = "Edit cat";
      document.getElementById("page-subtitle").textContent = "Update the details for this cat.";
      document.getElementById("submit-btn").textContent = "Update cat";

      const catNumberInput = document.getElementById("cat-number");
      catNumberInput.value = cat.cat_number || "";
      catNumberInput.readOnly = true;
      catNumberInput.disabled = true;

      document.getElementById("name").value = cat.name || "";
      document.getElementById("shelter").value = cat.shelter_id ? (await getShelterName(cat.shelter_id)) || "" : "";

      const ageValue = parseAgeValue(cat.age);
      document.getElementById("age-number").value = ageValue.number || "";
      document.getElementById("age-unit").value = ageValue.unit || "";

      document.getElementById("sex").value = cat.sex || "";
      document.getElementById("color").value = cat.color || "";
      document.getElementById("notes").value = cat.notes || "";

      return cat;
    }

    async function getShelterName(shelterId) {
      const { data } = await sb.from("shelters").select("name").eq("id", shelterId).maybeSingle();
      return data ? data.name : "";
    }

    document.getElementById("submit-btn").onclick = async () => {
      const err = document.getElementById("err");
      err.style.display = "none";

      const name = document.getElementById("name").value.trim();
      if (!name) {
        err.textContent = "Give the cat a name.";
        err.style.display = "block";
        return;
      }

      const ageNumber = document.getElementById("age-number").value.trim();
      const ageUnit = document.getElementById("age-unit").value;
      if (ageNumber && !ageUnit) {
        err.textContent = "If you enter an age number, choose the unit too.";
        err.style.display = "block";
        return;
      }

      const editId = new URLSearchParams(window.location.search).get("edit");
      const isEditing = Boolean(editId);
      const catNumberInput = document.getElementById("cat-number");

      if (!isEditing) {
        const enteredCatNumber = catNumberInput.value.trim();
        if (enteredCatNumber) {
          const { data: existingByCatNumber } = await sb
            .from("cats")
            .select("id")
            .eq("cat_number", Number(enteredCatNumber))
            .maybeSingle();

          if (!existingByCatNumber) {
            err.textContent = "That Cat ID does not exist. You cannot add a cat with a non-existent Cat ID.";
            err.style.display = "block";
            return;
          }
        }
      }

      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Saving…";

      try {
        const editId = new URLSearchParams(window.location.search).get("edit");
        const existingCat = editId ? await sb.from("cats").select("photo_url, added_by").eq("id", editId).maybeSingle().then(r => r.data) : null;
        if (editId && !existingCat) {
          throw new Error("Could not find that cat to update.");
        }

        const shelterName = document.getElementById("shelter").value.trim();
        const shelterId = await findOrCreateShelter(shelterName);

        const photoUrl = await uploadPhotoIfNeeded(existingCat?.photo_url || null);

        const ageNumber = document.getElementById("age-number").value.trim();
        const ageUnit = document.getElementById("age-unit").value;
        const age = ageNumber && ageUnit ? `${ageNumber} ${ageUnit}` : null;

        const payload = {
          name,
          shelter_id: shelterId,
          age,
          sex: document.getElementById("sex").value || null,
          color: document.getElementById("color").value.trim() || null,
          photo_url: photoUrl,
          notes: document.getElementById("notes").value.trim() || null
        };

        if (!editId) {
          payload.cat_number = await getNextCatNumber();
        }

        let cat;
        if (editId) {
          const { data, error } = await sb.from("cats").update(payload).eq("id", editId).select("id").maybeSingle();
          if (error) throw error;
          if (!data) throw new Error("Could not find that cat to update.");
          cat = data;
        } else {
          const { data, error } = await sb.from("cats").insert({
            ...payload,
            added_by: currentSession.user.id
          }).select("id").single();

          if (error) throw error;
          cat = data;

          await sb.from("ratings").insert({
            user_id: currentSession.user.id,
            cat_id: cat.id,
            elo_score: 1500
          });

          window.location.href = `compare.html?new=${cat.id}`;
          return;
        }

        window.location.href = `cat.html?id=${cat.id}`;
      } catch (e) {
        err.textContent = e.message || "Something went wrong saving that cat.";
        err.style.display = "block";
        btn.disabled = false;
        btn.textContent = document.getElementById("submit-btn").dataset.originalText || "Save cat";
      }
    };

    (async () => {
      currentSession = await requireAuth();
      if (!currentSession) return;
      renderNav("add");
      loadShelterOptions();
      populateCatNumberPreview();

      const editId = new URLSearchParams(window.location.search).get("edit");
      const saveButton = document.getElementById("submit-btn");
      saveButton.dataset.originalText = saveButton.textContent;

      if (editId) {
        try {
          await loadCatForEdit(editId);
        } catch (e) {
          const err = document.getElementById("err");
          err.textContent = e.message || "Could not open that cat for editing.";
          err.style.display = "block";
          saveButton.disabled = true;
        }
      }
    })();
  </script>
</body>
</html>
