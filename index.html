<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat Ranker — Feed</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"><div id="app-nav-top"></div></header>

  <main class="wrap" style="padding-top: 20px;">
    <h1>Feed</h1>
    <p style="color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 20px;">
      What everyone's been logging and ranking.
    </p>
    <div id="feed-list">
      <p class="empty">Loading…</p>
    </div>
  </main>

  <nav class="tabbar" id="app-nav-bottom"></nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function loadFeed() {
      await renderNav("feed");
      const listEl = document.getElementById("feed-list");

      const { data: rankedCats, error } = await sb
        .from("ratings")
        .select("updated_at, user_id, elo_score, profiles(username), cats(id, name, photo_url, breed, age, sex, color, tags, shelter_cat_id, shelters(name))")
        .order("updated_at", { ascending: false })
        .limit(20);

      if (error) {
        listEl.innerHTML = `<p class="empty">Could not load the feed right now.</p>`;
        return;
      }

      const events = (rankedCats || []).map(r => ({
        when: r.updated_at,
        who: r.profiles ? r.profiles.username : "someone",
        cat: r.cats
      })).filter(e => e.cat);

      if (events.length === 0) {
        listEl.innerHTML = `<p class="empty">No rankings yet — be the first to <a href="add.html">add a cat</a>.</p>`;
        return;
      }

      listEl.innerHTML = `<div class="card">` + events.slice(0, 12).map(e => {
        const c = e.cat;
        const meta = [c.shelters ? c.shelters.name : "", c.shelter_cat_id ? `#${c.shelter_cat_id}` : ""].filter(Boolean).join(" • ");
        const details = [c.breed, c.age, c.sex, c.color].filter(Boolean).join(" • ");
        return `
          <div class="feed-entry feed-ranked">
            <div class="dot"></div>
            <div class="feed-ranked-body">
              <div class="text"><span class="who">${e.who}</span> ranked <a href="cat.html?id=${c.id}"><strong>${c.name}</strong></a></div>
              <div class="when">${timeAgo(e.when)}</div>
              <div class="feed-rank-card">
                <img class="feed-rank-thumb" src="${c.photo_url || ''}" onerror="this.style.background='var(--gold-soft)'; this.src='';" />
                <div class="feed-rank-copy">
                  <div class="feed-rank-meta">${meta}</div>
                  <div class="feed-rank-details">${details || "No details added yet"}</div>
                  <div class="tags">${(c.tags || []).slice(0, 4).map(t => `<span class="tag">${t}</span>`).join("")}</div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("") + `</div>`;
    }
    loadFeed();
  </script>
</body>
</html>
