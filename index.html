<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toe Beans.AI — Feed</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"><div id="app-nav-top"></div></header>

  <main class="wrap" style="padding-top: 20px;">
    <h1>Feed</h1>
    <p style="color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 20px;">
      What everyone's been logging and ranking.
    </p>
    <div id="feed-filter" style="margin-bottom: 20px; display: flex; gap: 10px;">
      <button class="feed-filter-btn active" data-filter="all">All</button>
      <button class="feed-filter-btn" data-filter="friends">Friends</button>
    </div>
    <div id="feed-list">
      <p class="empty">Loading…</p>
    </div>
  </main>

  <nav class="tabbar" id="app-nav-bottom"></nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let allRankedCats = [];
    let friendIds = [];

    async function loadFeed(filter = "all") {
      const session = await getSession();
      await renderNav("feed");
      const listEl = document.getElementById("feed-list");

      // Get all ranked cats
      const { data: rankedCats, error } = await sb
        .from("ratings")
        .select("updated_at, user_id, elo_score, note, profiles(username), cats(id, name, photo_url, breed, age, sex, color, notes, shelter_cat_id, shelters(name))")
        .order("updated_at", { ascending: false })
        .limit(50);

      if (error) {
        listEl.innerHTML = `<p class="empty">Could not load the feed right now.</p>`;
        return;
      }

      allRankedCats = rankedCats || [];

      // Load friends if filtering by friends
      if (filter === "friends" && session) {
        const { data: friendships } = await sb
          .from("friends")
          .select("user_id_1, user_id_2")
          .or(`user_id_1.eq.${session.user.id},user_id_2.eq.${session.user.id}`);

        friendIds = (friendships || []).map(f => 
          f.user_id_1 === session.user.id ? f.user_id_2 : f.user_id_1
        );
        friendIds.push(session.user.id); // Include your own activity
      }

      // Filter events
      let events = allRankedCats
        .map(r => ({
          when: r.updated_at,
          userId: r.user_id,
          who: r.profiles ? r.profiles.username : "someone",
          note: r.note || r.cats?.notes,
          cat: r.cats
        }))
        .filter(e => e.cat);

      if (filter === "friends") {
        events = events.filter(e => friendIds.includes(e.userId));
      }

      if (events.length === 0) {
        const msg = filter === "friends" 
          ? "No activity from friends yet. <a href=\"profile.html#friends\">Add some friends!</a>" 
          : "No rankings yet — be the first to <a href=\"add.html\">add a cat</a>.";
        listEl.innerHTML = `<p class="empty">${msg}</p>`;
        return;
      }

      listEl.innerHTML = `<div class="card">` + events.slice(0, 12).map(e => {
        const c = e.cat;
        const meta = [c.shelters ? `<strong>${c.shelters.name}</strong>` : "", c.shelter_cat_id ? `#${c.shelter_cat_id}` : ""].filter(Boolean).join(" • ");
        const details = [c.breed, c.age, c.sex, c.color].filter(Boolean).join(" • ");
        const placeholder = `
          <div class="thumb-shell feed-rank-thumb">
            ${c.photo_url ? `<img class="feed-rank-thumb" src="${c.photo_url}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />` : ""}
            <div class="feed-rank-thumb cat-placeholder" style="display: ${c.photo_url ? 'none' : 'flex'};">
              <svg viewBox="0 0 64 64" aria-hidden="true">
                <path class="silhouette" d="M22 22c0-6 4-10 10-10s10 4 10 10v4c0 2 1 4 3 6 2-1 4-2 6-2 2 0 4 1 5 3l3 6c1 2 0 4-2 5l-4 2v7c0 5-4 9-9 9h-2v-8h-2v8h-2v-8h-2v8h-2v-8h-2v8h-2c-5 0-9-4-9-9v-7l-4-2c-2-1-3-3-2-5l3-6c1-2 3-3 5-3 2 0 4 1 6 2 2-2 3-4 3-6v-4zm8 8c-2 0-4 2-4 4s2 4 4 4h8c2 0 4-2 4-4s-2-4-4-4h-8zm-4 16h16v4H26v-4z"/>
              </svg>
            </div>
          </div>
        `;
        return `
          <div class="feed-entry feed-ranked">
            <div class="dot"></div>
            <div class="feed-ranked-body">
              <div class="text"><a class="who" href="rankings.html?user=${encodeURIComponent(e.userId)}">${e.who}</a> ranked <a href="cat.html?id=${c.id}"><strong>${c.name}</strong></a></div>
              <div class="when">${timeAgo(e.when)}</div>
              <div class="feed-rank-card">
                ${placeholder}
                <div class="feed-rank-copy">
                  <div class="feed-rank-meta">${meta}</div>
                  <div class="feed-rank-details">${details || "No details added yet"}</div>
                  ${e.note ? `<div class="feed-rank-details"><em>${e.note}</em></div>` : ""}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("") + `</div>`;
    }

    // Setup filter buttons
    document.addEventListener("DOMContentLoaded", () => {
      const filterBtns = document.querySelectorAll(".feed-filter-btn");
      filterBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          filterBtns.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          loadFeed(btn.dataset.filter);
        });
      });
      loadFeed("all");
    });
  </script>
</body>
</html>
